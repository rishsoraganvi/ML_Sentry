[project]
name = "ml-sentry"
version = "0.1.0"
description = "Open-source, self-hosted governance for machine-learning regression models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-pool>=3.3.3",
]

authors = [{ name = "Rishabh Soraganvi" }]

[project.urls]
Homepage = "https://github.com/rishsoraganvi/ML_Sentry"
Repository = "https://github.com/rishsoraganvi/ML_Sentry"
Issues = "https://github.com/rishsoraganvi/ML_Sentry/issues"
Documentation = "https://github.com/rishsoraganvi/ML_Sentry/tree/main/docs"

[project.scripts]
ml-sentry = "ml_sentry.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_sentry"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]  # generated from examples/colab/colab_walkthrough.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI dependency injection uses calls in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"examples/**" = ["S311"]
# Notebook-style script: imports per cell, and asserts are deliberate sanity checks.
"examples/colab/colab_walkthrough.py" = ["E402", "S101"]
"src/ml_sentry/demo.py" = ["S311"]  # seeded synthetic data, not security-relevant

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a PostgreSQL database (set ML_SENTRY_TEST_DATABASE_URL)",
    "stack: requires the running Docker Compose stack (set ML_SENTRY_E2E=1 and tokens)",
]
